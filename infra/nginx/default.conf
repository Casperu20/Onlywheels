# nginx in front of everything: serves the SPA, proxies the API/admin to gunicorn, serves uploaded media.
# TLS is terminated before this container (Cloudflare proxy, Caddy, or the hosting load balancer).

# Keep the original scheme when a TLS proxy sits in front, otherwise Django's SSL redirect would loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploads when no S3/R2 bucket is configured (shared volume with the web container).
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: every other path is a client-side route. Same headers as frontend/public/_headers.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/ https://*.ingest.sentry.io https://*.ingest.de.sentry.io; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }
}
